name: Esraa Learning Hub v2 CI

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/esraa-v2-ci.yml"
  push:
    branches:
      - main
      - esraa-learning-hub-v2
    paths:
      - "v2/**"
      - ".github/workflows/esraa-v2-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v2/package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
